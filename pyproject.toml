[project]
name = "failure-forensics"
version = "0.1.0"
description = "Traces every step of an AI pipeline, finds where a run went wrong, and turns failures into regression test cases (first target: text-to-sql-guardrails)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
]

[project.optional-dependencies]
# Local path, not on PyPI: needs a checkout of text-to-sql-guardrails next to this repo.
t2s = ["text-to-sql-guardrails"]

[tool.uv.sources]
text-to-sql-guardrails = { path = "../text-to-sql-guardrails", editable = true }

[tool.pytest.ini_options]
markers = ["pg: needs TEST_DATABASE_URL pointing at a disposable PostgreSQL database (and the t2s extra)"]

[project.scripts]
ff = "failure_forensics.cli:main"
failure-forensics = "failure_forensics.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
