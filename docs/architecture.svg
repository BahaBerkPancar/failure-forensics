<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">The failure-forensics loop</title>
  <desc id="d">A pipeline is traced into SQLite, failures are clustered, a cluster is exported as an mrd suite or a pytest file, and CI gates on it. Fixing the pipeline feeds new traces back in.</desc>
  <style>
    :root { --box: #EFEFEC; --line: #55554F; --text: #1D1D1B; --muted: #55554F; --accent: #B23A24; }
    @media (prefers-color-scheme: dark) {
      :root { --box: #1F1F1D; --line: #B4B4AC; --text: #ECECE8; --muted: #B4B4AC; --accent: #E4806A; }
    }
    text { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .box { fill: var(--box); stroke: var(--line); stroke-width: 1.5; }
    .hot { fill: var(--box); stroke: var(--accent); stroke-width: 2.5; }
    .h { font-size: 17px; font-weight: 700; }
    .s { font-size: 13px; fill: var(--muted); }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: var(--muted); }
    .arrow { stroke: var(--line); stroke-width: 1.75; fill: none; }
    .back { stroke: var(--accent); stroke-width: 1.75; fill: none; stroke-dasharray: 6 5; }
    .head { fill: var(--line); }
    .headb { fill: var(--accent); }
    .lbl { font-size: 13px; font-weight: 600; fill: var(--accent); }
  </style>
  <g>
    <rect class="box" x="16" y="40" width="160" height="104" rx="8"/>
    <text class="h" x="96" y="72" text-anchor="middle">Trace</text>
    <text class="s" x="96" y="94" text-anchor="middle">one run = one trace,</text>
    <text class="s" x="96" y="111" text-anchor="middle">each step = a span</text>
    <text class="code" x="96" y="132" text-anchor="middle">ff.run / ff.step</text>

    <rect class="box" x="212" y="40" width="160" height="104" rx="8"/>
    <text class="h" x="292" y="72" text-anchor="middle">Store</text>
    <text class="s" x="292" y="94" text-anchor="middle">local SQLite, WAL,</text>
    <text class="s" x="292" y="111" text-anchor="middle">redacted values</text>
    <text class="code" x="292" y="132" text-anchor="middle">ff runs / show</text>

    <rect class="box" x="408" y="40" width="160" height="104" rx="8"/>
    <text class="h" x="488" y="72" text-anchor="middle">Cluster</text>
    <text class="s" x="488" y="94" text-anchor="middle">culprit step + kind +</text>
    <text class="s" x="488" y="111" text-anchor="middle">error signature</text>
    <text class="code" x="488" y="132" text-anchor="middle">ff clusters / ui</text>

    <rect class="hot" x="604" y="40" width="160" height="104" rx="8"/>
    <text class="h" x="684" y="72" text-anchor="middle">Export</text>
    <text class="s" x="684" y="94" text-anchor="middle">one case per failing</text>
    <text class="s" x="684" y="111" text-anchor="middle">input: mrd or pytest</text>
    <text class="code" x="684" y="132" text-anchor="middle">ff export --to</text>

    <rect class="box" x="800" y="40" width="144" height="104" rx="8"/>
    <text class="h" x="872" y="72" text-anchor="middle">Gate</text>
    <text class="s" x="872" y="94" text-anchor="middle">CI fails while the</text>
    <text class="s" x="872" y="111" text-anchor="middle">failure still happens</text>
    <text class="code" x="872" y="132" text-anchor="middle">pytest / mrd</text>
  </g>
  <g>
    <path class="arrow" d="M176 92 H204"/><path class="head" d="M212 92 l-9 -5 v10z"/>
    <path class="arrow" d="M372 92 H400"/><path class="head" d="M408 92 l-9 -5 v10z"/>
    <path class="arrow" d="M568 92 H596"/><path class="head" d="M604 92 l-9 -5 v10z"/>
    <path class="arrow" d="M764 92 H792"/><path class="head" d="M800 92 l-9 -5 v10z"/>
  </g>
  <path class="back" d="M872 144 V206 H96 V152"/>
  <path class="headb" d="M96 144 l-5 9 h10z"/>
  <text class="lbl" x="484" y="196" text-anchor="middle">fix the pipeline, trace again: the failing input stays a test</text>
</svg>
